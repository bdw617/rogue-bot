[project]
name = "rogue-bot"
version = "0.1.0"
description = "A bot that plays BSD rogue in your terminal"
readme = "README.md"
authors = [
    { name = "bdw", email = "barry.waldbaum@flexcompute.com" }
]
requires-python = ">=3.14"
dependencies = [
    "optuna>=5.0.0",
    "pyte>=0.8.2",
]

[project.scripts]
rogue-bot = "rogue_bot:main"
rogue-bot-tune = "rogue_bot.tune:main"
rogue-bot-brain = "rogue_bot.brain:main"
rogue-bot-report = "rogue_bot.report:main"
rogue-bot-train = "rogue_bot.rl:train"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.optional-dependencies]
rl = [
    "torch>=2.13",
    "stable-baselines3>=2.9",
    "sb3-contrib>=2.9",
    "gymnasium>=1.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
